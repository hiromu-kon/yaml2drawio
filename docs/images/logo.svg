<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>yaml2drawio</title>
  <rect width="128" height="128" rx="28" fill="#0F172A"/>
  <!-- YAML: indented lines -->
  <g fill="#94A3B8">
    <rect x="16" y="34" width="28" height="7" rx="3.5"/>
    <rect x="24" y="48" width="22" height="7" rx="3.5"/>
    <rect x="32" y="62" width="16" height="7" rx="3.5"/>
    <rect x="24" y="76" width="20" height="7" rx="3.5"/>
    <rect x="16" y="90" width="26" height="7" rx="3.5"/>
  </g>
  <!-- arrow -->
  <path d="M56 54 L65 64 L56 74" fill="none" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- diagram: a group with two connected nodes -->
  <rect x="74" y="28" width="40" height="72" rx="8" fill="none" stroke="#A78BFA" stroke-width="3.5" stroke-dasharray="7 5"/>
  <line x1="94" y1="56" x2="94" y2="72" stroke="#E2E8F0" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="84" y="38" width="20" height="18" rx="4" fill="#22D3EE"/>
  <rect x="84" y="72" width="20" height="18" rx="4" fill="#F472B6"/>
