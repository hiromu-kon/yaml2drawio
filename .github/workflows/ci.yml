name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node and pnpm versions come from mise.toml
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Build an example with the bundled CLI
        run: node dist/cli.mjs build examples/quick-start.yaml -o out/quick-start.drawio --strict
      - name: Print the guide with the bundled CLI
        run: node dist/cli.mjs guide > /dev/null
      - name: Validate every example with the bundled CLI
        run: |
          for example in examples/*.yaml; do
            node dist/cli.mjs validate "$example" --strict --fail-unchecked --json
          done
