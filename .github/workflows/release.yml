name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  # npm trusted publishing authenticates with the workflow's OIDC token, so no npm token is stored
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Node and pnpm versions come from mise.toml
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm check
      # The first release was published by hand, before trusted publishing could be configured.
      # prepack builds dist/ before the tarball is made.
      - name: Publish unless this version is already on npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "yaml2drawio@$version" version > /dev/null 2>&1; then
            echo "yaml2drawio@$version is already on npm"
          else
            npm publish
          fi
