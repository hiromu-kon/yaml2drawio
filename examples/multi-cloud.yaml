# yaml-language-server: $schema=../schema.json
title: Multi-cloud
direction: vertical
layers: [Google Cloud, Azure, Kubernetes]
nodes:
  - { id: users, icon: general.users, label: Users }
  - row:
      - group: gcp.project
        layer: Google Cloud
        label: 'Google Cloud project: shop-prod'
        children:
          - { id: lb, icon: gcp.lb, label: Cloud Load Balancing }
          - { id: run, icon: gcp.cloud_run, label: Cloud Run }
          - { id: sql, icon: gcp.cloud_sql, label: Cloud SQL }
      - group: azure.subscription
        layer: Azure
        label: 'Azure subscription: corporate'
        children:
          - { id: cosmos, icon: azure.cosmos_db, label: Cosmos DB }
          - { id: app, icon: azure.app_service, label: App Service }
          - { id: front_door, icon: azure.front_door, label: Front Door }
  - group: k8s.cluster
    layer: Kubernetes
    label: 'GKE cluster: orders'
    children:
      - group: k8s.namespace
        label: 'Namespace: orders'
        direction: vertical
        children:
          - { id: ingress, icon: k8s.ingress_labeled, label: Ingress }
          - row:
              - { id: service, icon: k8s.service_labeled, label: Service }
              - { id: deployment, icon: k8s.deployment_labeled, label: Deployment }
              - { id: pvc, icon: k8s.pvc_labeled, label: PVC }
links:
  - [users.w, lb.w]
  - [users.e, front_door.e]
  - [lb.e, run.w]
  - { from: run.e, to: sql.w, label: PostgreSQL }
  - [front_door.w, app.e]
  - [app.w, cosmos.e]
  - { from: run.s, to: ingress.n, label: orders API }
  - [ingress.s, service.n]
  - [service.e, deployment.w]
  - [deployment.e, pvc.w]
